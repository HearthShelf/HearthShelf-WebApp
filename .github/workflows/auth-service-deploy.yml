name: Auth Service Deploy

# Auto-deploy the isolated Better Auth Worker (auth.hearthshelf.com) whenever its
# code lands on main. Runs the type check and tests, applies any new D1
# migrations (hearthshelf-auth), then deploys. workflow_dispatch lets you
# redeploy by hand (e.g. after rotating a secret) without a code change.
on:
  push:
    branches:
      - main
    paths:
      - 'auth-service/**'
      - '.github/workflows/auth-service-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auth-service-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-service
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: auth-service/package-lock.json

      - run: npm ci

      # A direct push to main skips PR CI, and this Worker holds every credential.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply hearthshelf-auth --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
