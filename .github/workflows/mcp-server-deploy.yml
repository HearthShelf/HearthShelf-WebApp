name: MCP Server Deploy

# Auto-deploy the MCP Worker (mcp.hearthshelf.com) whenever its code lands on
# main. It has no D1 database (state is a Durable Object plus the OAUTH_KV
# namespace, both declared in wrangler.toml), so this is type check + deploy.
# workflow_dispatch lets you redeploy by hand without a code change.
on:
  push:
    branches:
      - main
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-server-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mcp-server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
