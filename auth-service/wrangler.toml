name = "hearthshelf-auth"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
# Reachable only at its custom domain (auth.hearthshelf.com), not workers.dev.
workers_dev = false

# Isolated identity service. This Worker exists SEPARATELY from the control
# plane on purpose: it is the only component holding credential material
# (password hashes, passkey public keys, 2FA secrets), and it holds NEITHER the
# control plane's grant-signing key NOR any ABS credential. Compromise here
# cannot forge a grant that a self-hosted box would honour. See ../ARCHITECTURE.md.

# The custom domain is attached OUT OF BAND (Cloudflare dashboard / a one-time
# full-permission `wrangler deploy`), same as api. and logs.hearthshelf.com -
# deliberately NOT a [[routes]] block, because the CI deploy token is scoped to
# Workers Scripts + D1, not zone Workers Routes.

# Dedicated identity database - distinct from hearthshelf-control-plane.
# Create with:  wrangler d1 create hearthshelf-auth
# then paste the returned database_id below.
[[d1_databases]]
binding = "AUTH_DB"
database_name = "hearthshelf-auth"
database_id = "8c2c3559-ab26-42c7-9c0e-014a85f0d34c"
migrations_dir = "migrations"

[vars]
# Public origin of THIS Worker. Better Auth builds callback URLs from it.
BETTER_AUTH_URL = "https://auth.hearthshelf.com"
# Credentialed-CORS allowlist. Pinned; never reflected. Add localhost for dev.
TRUSTED_ORIGINS = "https://app.hearthshelf.com"
# WebAuthn Relying Party ID. MUST be the registrable domain the user sees in the
# browser, NOT this Worker's hostname. A passkey is bound to its RP ID for life:
# set this to auth.hearthshelf.com and every credential registered under it is
# unusable from app.hearthshelf.com, with no migration path. Using the parent
# domain keeps passkeys valid across app./auth./www. subdomains.
PASSKEY_RP_ID = "hearthshelf.com"
# Name shown in the OS passkey prompt.
PASSKEY_RP_NAME = "HearthShelf"
# The mobile app's deep-link scheme (must match app.config.js "scheme"). Trusted
# as an OAuth callback target, or every social sign-in and magic link from the
# phone is rejected as an open redirect - the callback lands on hearthshelf://,
# not an https origin.
APP_SCHEME = "hearthshelf"
# Parent domain the session cookie is scoped to. The app runs on
# app.hearthshelf.com and this service on auth.hearthshelf.com, so without this
# the browser would never send the session cookie to the app.
COOKIE_DOMAIN = ".hearthshelf.com"
# From: address for OTP + magic-link mail.
EMAIL_FROM = "no-reply@hearthshelf.com"

# Secrets (set via `wrangler secret put <NAME>`), never committed:
#   BETTER_AUTH_SECRET    - session signing/encryption key. Rotating it signs
#                           everyone out and voids pending magic links.
#   RESEND_API_KEY        - mail delivery. Email is an AUTHENTICATION path here:
#                           if this breaks, magic link + OTP sign-in break with
#                           it (passkeys and social keep working).
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET
#   APPLE_CLIENT_ID       - the Apple SERVICES ID (web sign-in identifier), NOT
#                           the app bundle id; the bundle id yields tokens Apple
#                           rejects with a generic invalid_client.
#   APPLE_PRIVATE_KEY_B64 - the .p8 private key, base64-encoded, plus
#   APPLE_TEAM_ID / APPLE_KEY_ID
#     ^ Apple issues no client secret - you sign one, and Apple caps it at six
#       months. Rather than store a signed secret that silently expires, this
#       Worker signs a short-lived one per request from the .p8 (src/appleSecret
#       .ts). Nothing to rotate. APPLE_CLIENT_SECRET remains as a manual
#       override if a pre-signed token is ever preferred.
#     ^ MUST remain the SAME Apple developer team as before. Apple's `sub` and
#       its Private Relay addresses are issued per team; a new team hands us a
#       different subject for the same person and orphans every seeded relay
#       user (see scripts/seed-legacy.mjs).
#
#       NOTE: APPLE_CLIENT_SECRET is a SIGNED JWT, not a static string. Apple
#       does not issue a client secret - you generate one from the team id, key
#       id and .p8 private key, and it expires (6 months max). Better Auth's
#       Apple provider takes the finished JWT, so minting and rotating it is an
#       operational task, not something this Worker does. See README.
#   DISCORD_CLIENT_ID / DISCORD_CLIENT_SECRET
